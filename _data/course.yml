# Controls the display order and titles for modules and chapters in _content/.
# Omit `title` on any module or chapter to automatically fall back to its folder name (e.g. "chapter-7" -> "Chapter 7").
# Files inside each folder (key-terms.md, key-terms-mindmap.md, study-guide.md, outline.md, mindmap.md, pq4rs.md, etc.)
# are discovered automatically.

- folder: module-1
  title: "[Mod. 1] Anatomy, Physiology, and Pathophysiology"
  chapters:
    - folder: chapter-7
      title: "[Ch. 7] Anatomy and Physiology"
    - folder: chapter-8
      title: "[Ch. 8] Pathophysiology"

- folder: module-2
  title: "[Mod 2] Introduction"
  chapters:
    - folder: chapter-1
      title: "[Ch. 1] EMS Systems, Research, and Public Health"
    - folder: chapter-2
      title: "[Ch. 2] Workforce Safety and Wellness of the EMT"
    - folder: chapter-3
      title: "[Ch. 3] Medical, Legal, and Ethical Issues"
    - folder: chapter-4
      title: "[Ch. 4] Documentation"
    - folder: chapter-5
      title: "[Ch. 5] Communication"
    - folder: chapter-6
      title: "[Ch. 6] Lifting and Moving Patients"