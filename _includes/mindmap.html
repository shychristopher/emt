<div class="map-actions" id="mapActions" hidden>
  <button class="button" type="button" id="mindmapViewToggle" aria-controls="mindmapStage">Read as outline</button>
  <p id="mindmapStatus" role="status"></p>
</div>
<div class="mindmap-stage" id="mindmapStage" hidden>
  <div class="map-toolbar" id="mapToolbar" role="group" aria-label="Mind map controls" hidden>
    <button class="button" type="button" id="mmZoomOut" aria-label="Zoom out">−</button>
    <button class="button" type="button" id="mmZoomIn" aria-label="Zoom in">+</button>
    <button class="button" type="button" id="mmFit">Fit</button>
    <button class="button" type="button" id="mmCollapse">Collapse</button>
    <button class="button" type="button" id="mmFullscreen" aria-pressed="false">Fullscreen</button>
  </div>
  <svg class="mindmap-svg" id="mindmapSvg" aria-label="Interactive mind map"></svg>
</div>
